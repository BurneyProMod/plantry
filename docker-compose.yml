version: '3.8'
services:
  backend:
    build: ./plantry-backend
    ports:
      - "5000:5000"
    networks:
      - plantry-net

  frontend:
    build: ./plantry
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    networks:
      - plantry-net

networks:
  plantry-net:
    driver: bridge